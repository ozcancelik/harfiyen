    <link rel="canonical" href="https://harfiyen.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harfiyen.dev/" />
    <meta property="og:site_name" content="Harfiyen" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="Harfiyen: Videoyu tarayıcıda yazıya dök, çevir, seslendir" />
    <meta property="og:description" content="Konuşmayı yazıya dök, çevir, yapay sesle seslendir, altyazıyı videoya yaz. Tarayıcıda ve iPhone'da; dosyan cihazından çıkmaz." />
    <meta property="og:image" content="https://harfiyen.dev/site/screens/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Safari on iPhone and iPad shows a banner that opens the app on the App Store. -->
    <meta name="apple-itunes-app" content="app-id=6832223953" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Harfiyen",
            "url": "https://harfiyen.dev/",
            "description": "Türkçe ve İngilizce konuşmayı tarayıcıda yazıya döker, çevirir, yapay sesle seslendirir ve altyazıyı videonun içine yazar. Dosyan bilgisayarından çıkmaz.",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web",
            "browserRequirements": "WebGPU",
            "inLanguage": "tr",
            "image": "https://harfiyen.dev/icon-512.png",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TRY" },
            "sameAs": ["https://github.com/ozcancelik/harfiyen"]
          },
          {
            "@type": "MobileApplication",
            "name": "Harfiyen: Videoya Altyazı",
            "url": "https://apps.apple.com/app/id6832223953",
            "installUrl": "https://apps.apple.com/app/id6832223953",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "iOS",
            "inLanguage": "tr",
            "image": "https://harfiyen.dev/icon-512.png",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TRY" }
          }
        ]
      }
    </script>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16191d" />
    <!-- The saved theme (src/lib/theme.ts), before the first paint, so the page does not flash the other one. -->
    <script>
      try {
        var t = localStorage.getItem("harfiyen.theme");
        var light = t === "light" || (t !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch (e) {}
    </script>
    <title>Harfiyen: Videoyu tarayıcıda yazıya dök, çevir, seslendir</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
